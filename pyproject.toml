[project]
name = "agentic-memory"
version = "0.1.0"
description = "Self-hostable long-term memory service for LLM agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# The base install is the Python SDK only (ADR 0023): a product that calls the API must not
# pull in LangChain, ONNX and Postgres drivers. `agentic-memory[server]` is everything else.
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
server = [
    "psycopg[binary,pool]>=3.3",
    "pgvector>=0.5",
    "fastembed>=0.9.0",
    "langgraph>=1.2.17",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "mcp>=2.3.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[project.scripts]
agentic-memory = "agentic_memory.cli:main"

[dependency-groups]
dev = [
    "agentic-memory[server]",
    "pytest>=8",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest-asyncio>=1.4.0",
]
load = ["locust>=2.47.0"]  # `uv sync --group load`; only for loadtest/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E501"]  # prompts and report tables are long lines of text
"loadtest/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import eval/ however pytest is started (CI uses `uv run pytest`)
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
